plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testImplementation 'io.cucumber:cucumber-java:7.21.1'
    testImplementation 'io.cucumber:cucumber-spring:7.21.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.21.1'
    testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.register('DbAutoRunCheck', Exec) {
    description = 'Check PostgreSQL container is running'
    commandLine 'docker', 'compose', 'up', '-d', 'db-test'
}

tasks.register('cucumberTest', Test) {
    description = 'Runs Cucumber BDD tests'
    useJUnitPlatform()
    dependsOn 'DbAutoRunCheck'
    filter {
        includeTestsMatching 'gift.CucumberTest'
    }
}

tasks.register('dockerBuild', Exec) {
    description = 'Build Docker image'
    commandLine 'docker', 'compose', 'build', 'app'
}

tasks.register('dockerUp', Exec) {
    description = 'Start Docker containers'
    commandLine 'docker', 'compose', 'up', '-d'
}

tasks.register('dockerDown', Exec) {
    description = 'Stop Docker containers'
    commandLine 'docker', 'compose', 'down'
}