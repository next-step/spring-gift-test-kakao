plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured:5.4.0'
	testImplementation 'io.cucumber:cucumber-java:7.18.0'
	testImplementation 'io.cucumber:cucumber-spring:7.18.0'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.0'
	testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('cucumberTest', Test) {
	description = 'Runs Cucumber acceptance tests with PostgreSQL'
	group = 'verification'

	useJUnitPlatform()
	include 'gift/acceptance/CucumberTest.class'

	doFirst {
		exec {
			commandLine 'docker', 'compose', 'up', '-d', '--wait'
		}
	}

	finalizedBy 'dockerComposeDown'
}

tasks.register('dockerComposeDown') {
	doLast {
		exec {
			commandLine 'docker', 'compose', 'down', '-v'
		}
	}
}
