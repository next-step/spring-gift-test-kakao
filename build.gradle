plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured:5.4.0'
	testImplementation 'io.cucumber:cucumber-java:7.18.1'
	testImplementation 'io.cucumber:cucumber-spring:7.18.1'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.1'
	testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

tasks.register('dockerBuild', Exec) {
	commandLine 'docker-compose', '-f', 'docker-compose.e2e.yml', 'build'
}

tasks.register('dockerUp', Exec) {
	commandLine 'docker-compose', '-f', 'docker-compose.e2e.yml', 'up', '-d', '--wait'
}

tasks.register('dockerDown', Exec) {
	commandLine 'docker-compose', '-f', 'docker-compose.e2e.yml', 'down', '--rmi', 'local'
}

tasks.register('cucumberTest', Test) {
	useJUnitPlatform()
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = true
	}
	systemProperty 'cucumber.glue', 'gift.e2e'
	systemProperty 'cucumber.features', 'src/test/resources/features'
	systemProperty 'cucumber.plugin', 'pretty'
	include 'gift/e2e/**'
}

tasks.register('cucumberE2eTest') {
	dependsOn 'dockerUp', 'cucumberTest'
	finalizedBy 'dockerDown'
}

tasks.named('cucumberTest').configure {
	mustRunAfter 'dockerUp'
}
