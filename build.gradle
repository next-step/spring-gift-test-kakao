plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured'
	testImplementation 'io.cucumber:cucumber-java:7.21.1'
	testImplementation 'io.cucumber:cucumber-spring:7.21.1'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.21.1'
	testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.named('test') {
	useJUnitPlatform()
	exclude 'gift/restassured/**'
}

tasks.register('restAssuredTest', Test) {
	useJUnitPlatform()
	include 'gift/restassured/**'
}

tasks.register('dockerUp', Exec) {
	commandLine 'docker-compose', 'up', '-d'
}

tasks.register('dockerDown', Exec) {
	commandLine 'docker-compose', 'down'
}

tasks.register('cucumberTest', Test) {
	useJUnitPlatform()
	exclude 'gift/restassured/**'
	systemProperty 'spring.profiles.active', 'cucumber'
	doFirst {
		exec {
			commandLine 'docker-compose', 'up', '-d'
		}
		// PostgreSQL healthcheck 대기
		def maxRetries = 20
		for (int i = 0; i < maxRetries; i++) {
			try {
				exec {
					commandLine 'docker-compose', 'exec', '-T', 'postgres', 'pg_isready', '-U', 'test'
				}
				break
			} catch (Exception e) {
				if (i == maxRetries - 1) throw e
				Thread.sleep(2000)
			}
		}
	}
	finalizedBy 'dockerDown'
}
