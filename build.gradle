plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured'

	// Cucumber BDD
	testImplementation platform('io.cucumber:cucumber-bom:7.18.1')
	testImplementation 'io.cucumber:cucumber-java'
	testImplementation 'io.cucumber:cucumber-spring'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine'
	testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.named('test') {
	useJUnitPlatform()
}

// --- Docker Compose + Cucumber 통합 ---

tasks.register('composeUp', Exec) {
	description = 'Start PostgreSQL via Docker Compose'
	commandLine 'docker', 'compose', 'up', '-d', '--wait'
}

tasks.register('composeDown', Exec) {
	description = 'Stop and remove Docker Compose services'
	commandLine 'docker', 'compose', 'down', '-v'
}

tasks.register('cucumberTest', Test) {
	description = 'Run Cucumber tests against PostgreSQL (Docker Compose)'
	group = 'verification'

	useJUnitPlatform()

	// Cucumber 테스트만 실행 (기존 RestAssured 테스트 제외)
	include 'gift/cucumber/**'

	dependsOn 'composeUp'
	finalizedBy 'composeDown'
}
