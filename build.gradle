plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

ext {
	cucumberVersion = '7.22.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:postgresql'

	// Cucumber BDD
	testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
	testImplementation "io.cucumber:cucumber-spring:${cucumberVersion}"
	testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
	testImplementation 'org.junit.platform:junit-platform-suite'

	// RestAssured for Cucumber HTTP tests
	testImplementation 'io.rest-assured:rest-assured'
}

tasks.named('test') {
	useJUnitPlatform()

	// Cucumber 엔진이 test 태스크에서 실행되지 않도록 제외
	exclude '**/cucumber/**'

	// Colima Docker 소켓 자동 감지 (macOS)
	def colimaSocket = file("${System.getProperty('user.home')}/.colima/default/docker.sock")
	if (colimaSocket.exists() && !System.getenv('DOCKER_HOST')) {
		environment 'DOCKER_HOST', "unix://${colimaSocket.absolutePath}"
		environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
	}
}

// Colima Docker 소켓 자동 감지 헬퍼
def colimaDockerHost = {
	def colimaSocket = file("${System.getProperty('user.home')}/.colima/default/docker.sock")
	if (colimaSocket.exists() && !System.getenv('DOCKER_HOST')) {
		return "unix://${colimaSocket.absolutePath}"
	}
	return null
}

// Docker Compose 태스크
tasks.register('dockerBuild', Exec) {
	description = 'Docker 이미지 빌드'
	group = 'docker'
	commandLine 'docker', 'compose', 'build'
	def dockerHost = colimaDockerHost()
	if (dockerHost) {
		environment 'DOCKER_HOST', dockerHost
	}
}

tasks.register('dockerUp', Exec) {
	description = 'Docker Compose 서비스 시작'
	group = 'docker'
	dependsOn 'dockerBuild'
	commandLine 'docker', 'compose', 'up', '-d', '--wait'
	def dockerHost = colimaDockerHost()
	if (dockerHost) {
		environment 'DOCKER_HOST', dockerHost
	}
}

tasks.register('dockerDown', Exec) {
	description = 'Docker Compose 서비스 중지'
	group = 'docker'
	commandLine 'docker', 'compose', 'down', '-v'
	def dockerHost = colimaDockerHost()
	if (dockerHost) {
		environment 'DOCKER_HOST', dockerHost
	}
}

// Cucumber BDD 테스트 태스크 (Docker Compose PostgreSQL 사용)
tasks.register('cucumberTest', Test) {
	description = 'Cucumber BDD 테스트 실행'
	group = 'verification'

	dependsOn 'dockerUp'
	finalizedBy 'dockerDown'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	// Cucumber Suite 클래스만 포함
	include '**/cucumber/CucumberSuite.class'

	// cucumber 프로필 활성화
	systemProperty 'spring.profiles.active', 'cucumber'
}
