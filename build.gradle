plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured'
	testImplementation 'io.cucumber:cucumber-java:7.22.0'
	testImplementation 'io.cucumber:cucumber-spring:7.22.0'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.22.0'
	testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeEngines 'cucumber'
	}
}

tasks.register('dockerBuild') {
	description = 'Docker 이미지 빌드'
	group = 'docker'
	dependsOn 'bootJar'
	doLast {
		exec {
			commandLine 'sh', '-c', 'docker compose build'
		}
	}
}

tasks.register('dockerUp') {
	description = 'Docker Compose 시작'
	group = 'docker'
	doLast {
		exec {
			commandLine 'sh', '-c', 'docker compose up -d --wait'
		}
	}
}

tasks.register('dockerDown') {
	description = 'Docker Compose 종료'
	group = 'docker'
	doLast {
		exec {
			commandLine 'sh', '-c', 'docker compose down'
		}
	}
}

tasks.register('cucumberTest', Test) {
	description = 'Cucumber 인수 테스트 실행 (Docker)'
	group = 'verification'
	dependsOn 'bootJar'
	useJUnitPlatform()

	systemProperty 'cucumber.features', 'classpath:features'
	systemProperty 'cucumber.glue', 'gift.acceptance'
	systemProperty 'cucumber.plugin', 'pretty'

	doFirst {
		exec {
			commandLine 'sh', '-c', 'docker compose build'
		}
		exec {
			commandLine 'sh', '-c', 'docker compose up -d --wait'
		}
	}

	finalizedBy 'dockerDown'
}
