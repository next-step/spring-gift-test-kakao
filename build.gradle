plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured'
	testImplementation 'io.cucumber:cucumber-java:7.20.1'
	testImplementation 'io.cucumber:cucumber-spring:7.20.1'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.20.1'
	testImplementation 'org.junit.platform:junit-platform-suite:1.11.4'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('dockerPostgresUp', Exec) {
	commandLine 'docker', 'compose', '-f', 'docker-compose-test.yml', 'up', '-d', '--wait'
}

tasks.register('dockerPostgresDown', Exec) {
	commandLine 'docker', 'compose', '-f', 'docker-compose-test.yml', 'down'
}

tasks.register('dockerBuild', Exec) {
	description = 'Build Docker image for the application'
	group = 'docker'
	commandLine 'docker', 'compose', '-f', 'docker-compose-test.yml', '--profile', 'docker', 'build'
}

tasks.register('dockerUp', Exec) {
	description = 'Start all Docker services (app + postgres)'
	group = 'docker'
	dependsOn 'dockerBuild'
	commandLine 'docker', 'compose', '-f', 'docker-compose-test.yml', '--profile', 'docker', 'up', '-d', '--wait'
}

tasks.register('dockerDown', Exec) {
	description = 'Stop all Docker services'
	group = 'docker'
	commandLine 'docker', 'compose', '-f', 'docker-compose-test.yml', '--profile', 'docker', 'down'
}

tasks.register('cucumberTest', Test) {
	description = 'Run Cucumber BDD tests'
	group = 'verification'
	useJUnitPlatform()

	if (project.hasProperty('tag')) {
		systemProperty 'cucumber.filter.tags', project.property('tag')
	}

	if (project.hasProperty('feature')) {
		systemProperty 'cucumber.features', "classpath:features/${project.property('feature')}.feature"
	}

	if (project.hasProperty('mode') && project.property('mode') == 'docker') {
		dependsOn 'dockerUp'
		finalizedBy 'dockerDown'
		include '**/RunCucumberContainerTest*'
	} else if (project.hasProperty('db') && project.property('db') == 'postgres') {
		dependsOn 'dockerPostgresUp'
		finalizedBy 'dockerPostgresDown'
		include '**/RunCucumberPostgresTest*'
	} else {
		include '**/RunCucumberH2Test*'
	}
}
