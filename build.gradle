plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-docker-compose'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured'
	testImplementation 'io.cucumber:cucumber-java:7.22.0'
	testImplementation 'io.cucumber:cucumber-spring:7.22.0'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.22.0'
	testImplementation 'org.junit.platform:junit-platform-suite'
}

tasks.named('test') {
	dependsOn 'dockerUp'
	useJUnitPlatform {
		excludeEngines 'cucumber'
	}
	exclude '**/CucumberTest*'
}

tasks.register('dockerBuild', Exec) {
	description = 'Builds Docker images using docker compose.'
	group = 'docker'
	commandLine 'docker', 'compose', 'build'
}

tasks.register('dockerUp', Exec) {
	description = 'Starts Docker containers and waits for the app to be ready.'
	group = 'docker'
	dependsOn 'dockerBuild'
	commandLine 'docker', 'compose', 'up', '-d'

	doLast {
		def maxRetries = 30
		def retryInterval = 2000
		def url = new URL('http://localhost:28080')
		for (int i = 0; i < maxRetries; i++) {
			try {
				def conn = (HttpURLConnection) url.openConnection()
				conn.connectTimeout = 2000
				conn.readTimeout = 2000
				conn.requestMethod = 'GET'
				if (conn.responseCode < 500) {
					logger.lifecycle("Application is ready (attempt ${i + 1})")
					return
				}
			} catch (Exception ignored) {}
			logger.lifecycle("Waiting for application... (${i + 1}/${maxRetries})")
			Thread.sleep(retryInterval)
		}
		throw new GradleException('Application did not start within 60 seconds.')
	}
}

tasks.register('dockerDown', Exec) {
	description = 'Stops and removes Docker containers.'
	group = 'docker'
	commandLine 'docker', 'compose', 'down'
}

tasks.register('cucumberTest', Test) {
	description = 'Runs Cucumber BDD tests.'
	group = 'verification'
	dependsOn 'dockerUp'
	useJUnitPlatform {
		includeEngines 'cucumber'
	}
	systemProperty 'cucumber.features', 'src/test/resources/features'
	systemProperty 'cucumber.glue', 'gift'
	systemProperty 'cucumber.plugin', 'pretty, html:build/reports/cucumber/cucumber-report.html'
}

