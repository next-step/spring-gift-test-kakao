services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gift_dev
      POSTGRES_USER: gift
      POSTGRES_PASSWORD: gift
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "gift" ]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "28080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker-test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/categories" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
