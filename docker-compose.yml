services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gift_dev
      POSTGRES_USER: gift
      POSTGRES_PASSWORD: gift
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gift"]
      interval: 2s
      timeout: 5s
      retries: 10