services:
  db-dev:
    image: postgres:17
    environment:
      POSTGRES_DB: gift_dev
      POSTGRES_USER: kakao
      POSTGRES_PASSWORD: choonsik
    ports:
      - "5432:5432"
    volumes:
      - dev-data:/var/lib/postgresql/data

  db-test:
    image: postgres:17
    environment:
      POSTGRES_DB: gift_test
      POSTGRES_USER: kakao
      POSTGRES_PASSWORD: choonsik
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kakao -d gift_test" ]
      interval: 10s
      timeout: 60s
      retries: 5

  app:
    build: .
    ports:
      - "28080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-test:5432/gift_test
      SPRING_DATASOURCE_USERNAME: kakao
      SPRING_DATASOURCE_PASSWORD: choonsik
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db-test:
        condition: service_healthy


volumes:
  dev-data:
