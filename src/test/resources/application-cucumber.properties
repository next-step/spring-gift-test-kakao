spring.application.name=gift
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.main.web-application-type=none

# Docker Compose PostgreSQL (테스트 JVM에서 데이터 셋업/클린업용)
spring.datasource.url=jdbc:postgresql://localhost:15432/gift_test
spring.datasource.username=gift
spring.datasource.password=gift
spring.datasource.driver-class-name=org.postgresql.Driver

# Kakao API (test stubs — 프로퍼티 바인딩에 필요)
kakao.message.token=test-token
kakao.message.url=https://kapi.kakao.com/v1/api/talk
kakao.social.token=test-token
kakao.social.url=https://kapi.kakao.com/v1/api/talk
